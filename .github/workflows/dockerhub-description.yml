# Pushes mongodb-noavx/DOCKERHUB.md as the description of the Docker Hub page
# of devferris/mongodb-no-avx.
#
# One-time setup (repository -> Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub user name (devferris)
#   DOCKERHUB_TOKEN     personal access token with scope "Read, Write, Delete"
#                       (Docker Hub -> Account settings -> Personal access tokens)
#
# Runs automatically when DOCKERHUB.md changes, and manually under Actions.

name: Update Docker Hub description

on:
  push:
    branches: [main]
    paths:
      - mongodb-noavx/DOCKERHUB.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: devferris/mongodb-no-avx
          short-description: "MongoDB 8.0 built without AVX – for Celeron/Atom/NAS CPUs. mongod only."
          readme-filepath: ./mongodb-noavx/DOCKERHUB.md
