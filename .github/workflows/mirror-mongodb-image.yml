# Mirrors the MongoDB no-AVX image from Docker Hub to the GitHub Container Registry.
#
# Trigger: Actions -> "Mirror MongoDB image to GHCR" -> "Run workflow"
# Result:  ghcr.io/<owner>/mongodb-no-avx:<tag>
#
# The image is copied unchanged (same layers, same content). Authentication to ghcr.io
# uses this repository's automatic GITHUB_TOKEN, no secrets required.

name: Mirror MongoDB image to GHCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag on Docker Hub (devferris/mongodb-no-avx:<tag>)"
        required: true
        default: "8.0.17-nehalem"
      latest:
        description: "Also tag as :latest"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      SOURCE: docker.io/devferris/mongodb-no-avx
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine target
        id: target
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/mongodb-no-avx" >> "$GITHUB_OUTPUT"

      - name: Pull image
        run: docker pull "${SOURCE}:${{ inputs.tag }}"

      - name: Check (version)
        run: docker run --rm "${SOURCE}:${{ inputs.tag }}" --version

      - name: Tag and push
        env:
          TARGET: ${{ steps.target.outputs.image }}
        run: |
          docker tag "${SOURCE}:${{ inputs.tag }}" "${TARGET}:${{ inputs.tag }}"
          docker push "${TARGET}:${{ inputs.tag }}"
          if [ "${{ inputs.latest }}" = "true" ]; then
            docker tag "${SOURCE}:${{ inputs.tag }}" "${TARGET}:latest"
            docker push "${TARGET}:latest"
          fi

      - name: Summary
        env:
          TARGET: ${{ steps.target.outputs.image }}
        run: |
          {
            echo "### Mirrored"
            echo ""
            echo "\`${SOURCE}:${{ inputs.tag }}\` → \`${TARGET}:${{ inputs.tag }}\`"
            echo ""
            echo "Digest: \`$(docker inspect --format '{{index .RepoDigests 0}}' "${TARGET}:${{ inputs.tag }}" 2>/dev/null || echo n/a)\`"
          } >> "$GITHUB_STEP_SUMMARY"
