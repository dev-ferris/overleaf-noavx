# Sandboxed Compiles: jedes Projekt kompiliert in einem eigenen TeX-Live-Container.
# Damit stehen alle LaTeX-Pakete (z. B. KOMA-Script/scrlttr2) zur Verfügung, ohne das
# Overleaf-Image anzupassen. Nur in der CEP verfügbar, nicht in der normalen CE.
#
#   docker pull texlive/texlive:latest-full      # vorher ziehen (~5 GB), Compose lädt es nicht
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d
#
# ACHTUNG: Der Container erhält Zugriff auf den Docker-Socket des Hosts und damit
# faktisch Root-Rechte auf dem Host. Nur in vertrauenswürdigen Umgebungen einsetzen.

services:
  sharelatex:
    volumes:
      # Bind-Mount statt Named Volume: Die Compile-Container werden vom Docker-Daemon
      # des Hosts gestartet und brauchen einen Host-Pfad (SANDBOXED_COMPILES_HOST_DIR).
      # Ersetzt das Named Volume aus docker-compose.yml (gleicher Zielpfad).
      - ${OVERLEAF_DATA_DIR:?OVERLEAF_DATA_DIR in .env setzen}:/var/lib/overleaf
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_RUNNER: "true"
      SANDBOXED_COMPILES: "true"
      SANDBOXED_COMPILES_HOST_DIR: ${OVERLEAF_DATA_DIR}/data/compiles
