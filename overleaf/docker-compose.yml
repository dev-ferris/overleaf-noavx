# Overleaf Community Edition Extended (CEP) 6.x mit MongoDB 8 ohne AVX
#
#   cp .env.example .env                    # Compose-Variablen (Images, Hostname, Pfade)
#   cp overleaf.env.example overleaf.env    # Overleaf-Konfiguration (Secrets!)
#   docker compose up -d
#
# TeX Live: vollständig aus texlive/texlive, per Volume eingebunden (Service "texlive-init").
# Der erste Start kopiert ~6 GB ins Volume und dauert einige Minuten.
#
# Admin-Shell für MongoDB (das no-AVX-Image enthält kein mongosh):
#   docker compose run --rm mongo-shell                         # interaktiv
#   docker compose run --rm mongo-shell --quiet --eval 'db.version()'

name: ${COMPOSE_PROJECT_NAME:-overleaf}

x-common: &common
  restart: unless-stopped

services:
  redis:
    <<: *common
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    <<: *common
    # MongoDB 8.0 ohne AVX (Docker Hub), Eigenbau siehe ../mongodb-noavx
    image: ${MONGO_IMAGE:-devferris/mongodb-no-avx:8.0.17-nehalem}
    command: "--replSet rs0 --bind_ip_all --wiredTigerCacheSizeGB ${MONGO_CACHE_GB:-1}"
    environment:
      # tcmalloc in MongoDB 8 verträgt sich nicht mit glibc-rseq (Performance).
      # Im aktuellen Dockerfile gesetzt, hier zusätzlich für ältere Image-Builds.
      GLIBC_TUNABLES: glibc.pthread.rseq=0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Kein mongosh im Image -> TCP-Check auf den Port
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/27017'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Initialisiert das Replica Set einmalig (idempotent, beendet sich danach).
  # Overleaf braucht ein Replica Set; der Hostname muss "mongo:27017" sein,
  # sonst trägt MongoDB die Container-ID ein, die nach einem Neuerstellen nicht mehr stimmt.
  mongo-init:
    image: ${MONGOSH_IMAGE:-alpine/mongosh:latest}
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["mongosh", "mongodb://mongo:27017/?directConnection=true", "--quiet", "--eval"]
    command:
      - |
        try {
          rs.status();
          print("Replica Set bereits initialisiert");
        } catch (e) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
          print("Replica Set initialisiert");
        }

  # Vollständiges TeX Live per Volume (kein Docker-Socket nötig).
  # Kopiert TeX Live aus dem texlive/texlive-Image ins Volume "texlive" und beendet sich.
  # - Kopiert nur, wenn sich der Inhalt geändert hat (Marker = Jahrgang + Prüfsumme der
  #   Paketdatenbank) -> ein neues TEXLIVE_IMAGE wird beim nächsten "up" übernommen.
  # - Legt den Link "current" auf den Jahrgang an; Overleaf findet die Binaries über PATH,
  #   unabhängig davon, welcher Jahrgang im Overleaf-Image selbst steckt.
  texlive-init:
    image: ${TEXLIVE_IMAGE:-texlive/texlive:latest-full}
    restart: "no"
    network_mode: none
    volumes:
      - texlive:/target
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        SRC=/usr/local/texlive
        YEAR=$$(ls -1 "$$SRC" | grep -E '^[0-9]{4}$$' | sort | tail -n 1)
        [ -n "$$YEAR" ] || { echo "FEHLER: kein TeX-Live-Jahrgang unter $$SRC" >&2; exit 1; }
        ID="$$YEAR $$(md5sum "$$SRC/$$YEAR/tlpkg/texlive.tlpdb" | cut -d' ' -f1)"
        if [ "$$(cat /target/.texlive-source 2>/dev/null || true)" != "$$ID" ]; then
          echo "Kopiere TeX Live $$YEAR ins Volume (einmalig, einige Minuten) ..."
          find /target -mindepth 1 -delete
          cp -a "$$SRC/." /target/
          echo "$$ID" > /target/.texlive-source
        else
          echo "TeX Live $$YEAR im Volume ist aktuell"
        fi
        ln -sfn "$$YEAR" /target/current
        test -x /target/current/bin/x86_64-linux/latexmk \
          || { echo "FEHLER: latexmk fehlt in /target/current/bin/x86_64-linux" >&2; exit 1; }
        echo "OK: $$(/target/current/bin/x86_64-linux/pdflatex --version | head -n 1)"

  sharelatex:
    <<: *common
    image: ${OVERLEAF_IMAGE:-overleafcep/sharelatex:6.3.0-ext-v5.1}
    env_file: overleaf.env
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      texlive-init:
        condition: service_completed_successfully
    environment:
      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex?replicaSet=rs0
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis

      # TeX Live aus dem Volume zuerst im PATH. CLSI ruft latexmk/pdflatex über den PATH
      # auf; die Symlinks des Overleaf-Images in /usr/local/bin werden damit überdeckt.
      PATH: /usr/local/texlive/current/bin/x86_64-linux:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - sharelatex_data:/var/lib/overleaf
      # Ersetzt das minimale TeX Live des Overleaf-Images durch das vollständige
      - texlive:/usr/local/texlive:ro
    labels:
      autoheal: "true"
      # caddy-docker-proxy: Route aus den Labels erzeugen
      caddy: ${OVERLEAF_HOSTNAME:-https://overleaf.example.com}
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy_ingress_network: ${CADDY_NETWORK:-caddy}
    networks:
      - default
      - caddy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  mongo-shell:
    image: ${MONGOSH_IMAGE:-alpine/mongosh:latest}
    profiles: ["tools"]
    entrypoint: ["mongosh", "mongodb://mongo:27017/?directConnection=true"]
    depends_on:
      - mongo

volumes:
  texlive:
  sharelatex_data:
  mongo_data:
  redis_data:

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
