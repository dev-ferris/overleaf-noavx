# Overleaf Community Edition Extended (CEP) 6.x mit MongoDB 8 ohne AVX
#
#   cp .env.example .env                    # Compose-Variablen (Images, Port, Projektname)
#   cp overleaf.env.example overleaf.env    # Overleaf-Konfiguration (Secrets!)
#   docker compose up -d
#
# TeX Live: vollständig aus texlive/texlive, per Volume eingebunden (Service "texlive-init").
# Der erste Start kopiert ~6 GB ins Volume und dauert einige Minuten.
#
# Admin-Shell für MongoDB (das no-AVX-Image enthält kein mongosh):
#   docker compose run --rm mongo-shell                         # interaktiv
#   docker compose run --rm mongo-shell --quiet --eval 'db.version()'
#
# Backup: Service "backup" (offen/docker-volume-backup), täglich, MongoDB per mongodump.

name: ${COMPOSE_PROJECT_NAME:-overleaf}

x-common: &common
  restart: unless-stopped

services:
  redis:
    <<: *common
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    volumes:
      - redis_data:/data
    labels:
      # Während des Backups stoppen; Redis schreibt beim Beenden einen konsistenten Snapshot
      docker-volume-backup.stop-during-backup: ${BACKUP_LABEL:-overleaf}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    <<: *common
    # MongoDB 8.0 ohne AVX (Docker Hub), Eigenbau siehe ../mongodb-noavx
    image: ${MONGO_IMAGE:-devferris/mongodb-no-avx:8.0.17-nehalem}
    command: "--replSet rs0 --bind_ip_all --wiredTigerCacheSizeGB ${MONGO_CACHE_GB:-1}"
    environment:
      # tcmalloc in MongoDB 8 verträgt sich nicht mit glibc-rseq (Performance).
      # Im aktuellen Dockerfile gesetzt, hier zusätzlich für ältere Image-Builds.
      GLIBC_TUNABLES: glibc.pthread.rseq=0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Kein mongosh im Image -> TCP-Check auf den Port
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/27017'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Initialisiert das Replica Set (idempotent) und bleibt danach laufen:
  # - Overleaf startet erst, wenn ein beschreibbarer Primary existiert (Healthcheck).
  #   Der Hostname muss "mongo:27017" sein, sonst trägt MongoDB die Container-ID ein,
  #   die nach einem Neuerstellen nicht mehr stimmt.
  # - Der laufende Container dient dem Backup als Ausführungsort für mongodump
  #   (offen führt archive-pre/-post per "docker exec" aus, das braucht einen laufenden Container).
  # MongoDB selbst wird für das Backup NICHT gestoppt: mongodump --oplog liefert auch im
  # laufenden Betrieb einen konsistenten Stand; gesichert wird nur das Dump-Volume.
  mongo-init:
    <<: *common
    image: ${MONGOSH_IMAGE:-alpine/mongosh:latest}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - mongo_dump:/dump
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rm -f /tmp/rs-ready
        until mongosh "mongodb://mongo:27017/?directConnection=true" --quiet --eval '
          try { rs.status() }
          catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
            print("Replica Set initialisiert");
          }
          while (!db.hello().isWritablePrimary) { sleep(500) }
          print("Replica Set bereit")'
        do
          echo "MongoDB noch nicht bereit, neuer Versuch in 5 s"; sleep 5
        done
        touch /tmp/rs-ready
        exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/rs-ready"]
      interval: 5s
      timeout: 3s
      retries: 60
    labels:
      docker-volume-backup.exec-label: ${BACKUP_LABEL:-overleaf}
      docker-volume-backup.archive-pre: >-
        /bin/sh -c 'rm -f /dump/* && mongodump --quiet
        --uri="mongodb://mongo:27017/?directConnection=true"
        --oplog --gzip --archive=/dump/mongo.archive.gz'
      # nach dem Archivieren: Dump wieder entfernen
      docker-volume-backup.archive-post: /bin/sh -c 'rm -f /dump/*'

  # Vollständiges TeX Live per Volume (kein Docker-Socket nötig).
  # Kopiert TeX Live aus dem texlive/texlive-Image ins Volume "texlive" und beendet sich.
  # - Kopiert nur, wenn sich der Inhalt geändert hat (Marker = Jahrgang + Prüfsumme der
  #   Paketdatenbank) -> ein neues TEXLIVE_IMAGE wird beim nächsten "up" übernommen.
  # - Legt den Link "current" auf den Jahrgang an; Overleaf findet die Binaries über PATH,
  #   unabhängig davon, welcher Jahrgang im Overleaf-Image selbst steckt.
  texlive-init:
    image: ${TEXLIVE_IMAGE:-texlive/texlive:latest-full}
    restart: "no"
    network_mode: none
    volumes:
      - texlive:/target
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        SRC=/usr/local/texlive
        YEAR=$$(ls -1 "$$SRC" | grep -E '^[0-9]{4}$$' | sort | tail -n 1)
        [ -n "$$YEAR" ] || { echo "FEHLER: kein TeX-Live-Jahrgang unter $$SRC" >&2; exit 1; }
        ID="$$YEAR $$(md5sum "$$SRC/$$YEAR/tlpkg/texlive.tlpdb" | cut -d' ' -f1)"
        if [ "$$(cat /target/.texlive-source 2>/dev/null || true)" != "$$ID" ]; then
          echo "Kopiere TeX Live $$YEAR ins Volume (einmalig, einige Minuten) ..."
          find /target -mindepth 1 -delete
          cp -a "$$SRC/." /target/
          echo "$$ID" > /target/.texlive-source
        else
          echo "TeX Live $$YEAR im Volume ist aktuell"
        fi
        ln -sfn "$$YEAR" /target/current
        test -x /target/current/bin/x86_64-linux/latexmk \
          || { echo "FEHLER: latexmk fehlt in /target/current/bin/x86_64-linux" >&2; exit 1; }
        echo "OK: $$(/target/current/bin/x86_64-linux/pdflatex --version | head -n 1)"

  sharelatex:
    <<: *common
    image: ${OVERLEAF_IMAGE:-overleafcep/sharelatex:6.3.0-ext-v5.1}
    env_file: overleaf.env
    depends_on:
      mongo-init:
        condition: service_healthy
      redis:
        condition: service_healthy
      texlive-init:
        condition: service_completed_successfully
    environment:
      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex?replicaSet=rs0
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis

      # TeX Live aus dem Volume zuerst im PATH. CLSI ruft latexmk/pdflatex über den PATH
      # auf; die Symlinks des Overleaf-Images in /usr/local/bin werden damit überdeckt.
      PATH: /usr/local/texlive/current/bin/x86_64-linux:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - sharelatex_data:/var/lib/overleaf
      # Ersetzt das minimale TeX Live des Overleaf-Images durch das vollständige
      - texlive:/usr/local/texlive:ro
    ports:
      # Für einen Reverse Proxy auf demselben Host z. B. "127.0.0.1:8088" setzen
      - "${OVERLEAF_BIND:-8088}:80"
    labels:
      autoheal: "true"
      # Während des Backups stoppen, damit sharelatex_data konsistent gesichert wird
      docker-volume-backup.stop-during-backup: ${BACKUP_LABEL:-overleaf}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # Zeitgesteuertes Backup mit offen/docker-volume-backup.
  # Ablauf je Lauf: mongodump (archive-pre in mongo-init) -> sharelatex + redis stoppen ->
  # tar.gz der Volumes -> Container wieder starten -> Dump löschen (archive-post) -> Aufräumen.
  # Braucht den Docker-Socket (nur lesend), um Container zu stoppen und Befehle auszuführen.
  # NICHT gesichert: mongo_data (Rohdateien, stattdessen Dump) und texlive (reproduzierbar).
  backup:
    <<: *common
    image: ${BACKUP_IMAGE:-offen/docker-volume-backup:v2}
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BACKUP_CRON_EXPRESSION: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_FILENAME: overleaf-%Y-%m-%dT%H-%M-%S.{{ .Extension }}
      BACKUP_PRUNING_PREFIX: "overleaf-"
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_STOP_DURING_BACKUP_LABEL: ${BACKUP_LABEL:-overleaf}
      EXEC_LABEL: ${BACKUP_LABEL:-overleaf}
    volumes:
      - mongo_dump:/backup/mongo_dump:ro
      - sharelatex_data:/backup/sharelatex_data:ro
      - redis_data:/backup/redis_data:ro
      - ./overleaf.env:/backup/config/overleaf.env:ro
      - ./.env:/backup/config/compose.env:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${BACKUP_DIR:-./backup}:/archive

  mongo-shell:
    image: ${MONGOSH_IMAGE:-alpine/mongosh:latest}
    profiles: ["tools"]
    entrypoint: ["mongosh", "mongodb://mongo:27017/?directConnection=true"]
    depends_on:
      - mongo

volumes:
  texlive:
  sharelatex_data:
  mongo_data:
  mongo_dump:
  redis_data:
